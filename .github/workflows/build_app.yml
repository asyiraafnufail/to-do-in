name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      pb_url:
        description: 'PocketBase Backend URL'
        required: true
        default: 'https://pb-dev.todoin.id'
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build_app.yml'

jobs:
  build-ios:
    name: Build iOS IPA (Cloud Mac)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          echo "Active Xcode Version:"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Precache iOS Engine Artifacts
        run: flutter precache --ios

      - name: Install Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        working-directory: flutter_app
        run: |
          flutter build ios --release --no-codesign --dart-define=PB_URL=${{ inputs.pb_url || 'https://pb-dev.todoin.id' }}

      - name: Package App into Sideloadable .ipa
        working-directory: flutter_app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r -p Runner.app Payload/
          zip -r -y -q todoin-release.ipa Payload
          rm -rf Payload
          echo "=== IPA Berhasil Dibuat ==="
          ls -lh todoin-release.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoin-ios-ipa
          path: flutter_app/build/ios/iphoneos/todoin-release.ipa
          retention-days: 14
          if-no-files-found: error
